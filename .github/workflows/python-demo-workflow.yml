
name: Python Demo CI

on:
  push:
    branches:
      - main
    paths:
      - 'python-demo/**'
      - '.github/workflows/python-demo-workflow.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'python-demo/**'
      - '.github/workflows/python-demo-workflow.yml'

  workflow_dispatch:

jobs:
  build:
    name: Build and Test Python Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-demo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python Tests
        run: |
          pytest tests/ -v
