
name: Python Demo CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'python-demo/**'
      - '.github/workflows/python-demo-workflow.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'python-demo/**'
      - '.github/workflows/python-demo-workflow.yml'

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python version
        run: python --version

      - name: Compile Python files
        run: python -m compileall -q python-demo/src python-demo/tests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pytest
        working-directory: ./python-demo
        run: python -m pytest tests/ -v
